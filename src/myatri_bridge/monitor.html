<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小温暖 · 上下文监视</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151c;color:#e7edf5}body{max-width:1080px;margin:36px auto;padding:0 22px}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px}p{line-height:1.7;color:#aebdce}.status{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#163d32;color:#8bdec0;padding:7px 12px;border-radius:20px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.card{background:#19222e;border:1px solid #2c3949;border-radius:14px;padding:22px;margin-bottom:18px}.value{font-size:37px;font-weight:650;color:#80dabb}.hint{font-size:13px;color:#9dacc0}.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #2b3644;font-size:14px}.row span:last-child{text-align:right}progress{width:100%;height:10px;accent-color:#80dabb;margin:15px 0 6px}.warning{color:#f2bf7e}svg{width:100%;height:50px;margin-top:14px}code{color:#80dabb}a{color:#80dabb}#error{color:#ffb4ac}footer{margin:20px 0 32px;font-size:13px;color:#9dacc0}
</style>
<div class="status"><h1>小温暖 · 上下文监视</h1><span class="tag" id="status">正在读取</span></div>
<p>每 2 秒更新。展示 API 已确认的最近一次请求；生成过程中不会虚构逐 Token 进度。</p>
<div id="error" role="alert"></div><main id="libraries" class="grid"></main>
<section class="card"><h2>群聊共享日额度</h2><div id="budget"></div></section>
<section class="card"><h2>旁听与摘要</h2><div id="memory"></div></section>
<footer>缓存命中的输入仍占上下文。每日累计消耗与单次上下文是不同指标。<br>只读本机统计，不调用模型，不显示聊天正文或密钥。机器可读接口：<a href="/api/metrics">/api/metrics</a></footer>
<script>
const fmt=n=>typeof n==='number'?n.toLocaleString('zh-CN'):'暂无数据';
const esc=s=>String(s??'未知').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=s=>s?new Date(s).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'旧日志未记录';
const row=(a,b)=>`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
function spark(rows){const values=rows.map(x=>x.prompt_tokens).filter(x=>typeof x==='number');if(values.length<2)return '';const hi=Math.max(...values,1),lo=Math.min(...values),scale=Math.max(hi-lo,hi*.05,1);return `<svg viewBox="0 0 300 45" aria-label="近期输入Token变化"><polyline fill="none" stroke="#80dabb" stroke-width="2" points="${values.map((v,i)=>`${i*300/(values.length-1)},${40-(v-lo)*33/scale}`).join(' ')}"/></svg>`}
async function refresh(){try{const response=await fetch('/api/metrics',{cache:'no-store'});if(!response.ok)throw Error('读取失败');const data=await response.json();document.querySelector('#status').textContent='已更新 '+new Date(data.updated_at).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});document.querySelector('#error').textContent='';
document.querySelector('#libraries').innerHTML=data.libraries.map(lib=>{const u=lib.latest_conversation||{},pc=lib.context_usage_percent;const thinking=u.thinking_enabled===null||u.thinking_enabled===undefined?'当前代码默认关闭；旧请求未记录':u.thinking_enabled?'已开启':'已关闭';return `<article class="card"><h2>${esc(lib.label)}</h2><div class="value">${fmt(u.prompt_tokens)}</div><div class="hint">最近一次 API 输入 Token</div><progress max="100" value="${typeof pc==='number'?Math.min(pc,100):0}"></progress><div class="hint">占本机上下文限额 ${typeof pc==='number'?pc+'%':'未知'} · 本机限额 ${fmt(lib.configured_context_limit)}</div>${row('压缩触发阈值',fmt(lib.compaction_threshold)+' Token')}${row('距压缩阈值占比',typeof lib.compaction_usage_percent==='number'?lib.compaction_usage_percent+'%':'未知')}${row('最近输出 / 推理 Token',fmt(u.completion_tokens)+' / '+(u.reasoning_tokens===null||u.reasoning_tokens===undefined?'API未单列':fmt(u.reasoning_tokens)))}${row('输入缓存命中',fmt(u.cached_input_tokens)+' Token')}${row('深度思考',thinking)}${row('模型',u.model||'未知')}${row('最近会话完成',time(lib.last_conversation_completed_at))}${row('最近调用耗时',typeof u.elapsed_seconds==='number'?u.elapsed_seconds.toFixed(2)+' 秒':'未知')}${row('最近调用结束原因',u.finish_reason||'旧日志未记录')}${spark(lib.recent_conversations)}<div class="hint">${lib.status==='temporarily_unavailable'?'数据库暂时忙，稍后自动重试':'折线：近期已记录请求的输入大小；不会逐轮累加'}</div></article>`}).join('')||'<p>尚无会话数据。正常聊天后会自动出现。</p>';
const b=data.group_daily_budget;document.querySelector('#budget').innerHTML=row('已结算 / 日限额',fmt(b.used_tokens)+' / '+fmt(b.daily_limit)+' Token')+row('尚未结算的请求预留',fmt(b.reserved_tokens)+' Token')+row('额度日期与重置',b.day_utc+' UTC · 北京时间'+b.reset_beijing);
const m=data.listening;document.querySelector('#memory').innerHTML=row('已旁听消息 / 已保存摘要',fmt(m.messages)+' / '+fmt(m.summaries))+m.pending.map(x=>row('待处理窗口至第 '+x.window_end+' 条','尝试 '+x.attempts+' 次 · '+(x.error_type||'待处理')+' · 下次 '+time(x.retry_at?new Date(x.retry_at*1000).toISOString():null))).join('');
}catch(e){document.querySelector('#status').textContent='连接中断';document.querySelector('#error').textContent='暂时无法读取本机监视服务，正在重试。上次数据可能已过时。'}finally{setTimeout(refresh,2000)}}refresh();
</script></html>
